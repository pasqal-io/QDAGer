[tool.poetry]
name = "sym_graphs"
version = "0.0.1"
description = "QGML project (internal or external)"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
torch = "^2.7.0"
torch-geometric = "^2.6.1"
emu-mps = "^2.3.0"
emu-sv = "^2.3.0"
multiset = "^3.2.0"
ogb = "^1.3.6"
pdf2image = "^1.17.0"
numba = "^0.64.0"
igraph = "^1.0.0"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
pytest = "^7.3.1"
pytest-cov="^5.0.0"
taskipy = "^1.10.4"
isort = "^5.12.0"
black = "^23.3.0"
flake8 = "^6.0.0"
mypy = "^1.3.0"
[tool.isort]
profile = "black"
line_length = 99

[tool.black]
line-length = 99
target-version = ["py310", "py311", "py312"]

[tool.mypy]
ignore_missing_imports = true
[tool.taskipy.tasks]
lint = "flake8 --max-line-length 99 --extend-ignore=E203 ."
test = "pytest -v"
type = "mypy ."
format-isort = "isort ."
format-black = "black ."
precommit = "task format-isort && task format-black && task lint"

[build-system]
requires = ["poetry-core>=1.2.3"]
build-backend = "poetry.core.masonry.api"
